<!DOCTYPE html>
<html>
<head>
    <title>akshay Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
</head>

<body>

    <div class="akshay calculator">
        <h1> __________________________................akshay Calculator................__________________________ </h1>

        <form method="POST">
            <input type="number" step="any" name="num1" placeholder="First number" required>

            <select name="operator">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>

            <input type="number" step="any" name="num2" placeholder="Second number" required>

            <button type="submit">Calculate</button>
        </form>

        <h2>Result: {{ result }}</h2>
    </div>

</body>
</html>
